<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión o registrarse</title>
  <link rel="icon" href="../assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/estilos.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body class="login-page">
  <div id="nav"></div>

  <main>
    <div class="demo-login">
      <strong>🧪 Demo: entra con una cuenta de prueba</strong><br>
      <button type="button" id="quick-empleado">Entrar como Empleado</button>
      <button type="button" id="quick-cliente">Entrar como Cliente</button>
      <div class="mt-2" style="font-size:12px" id="demo-creds"></div>
    </div>

    <div class="contenedor__todo">
      <div class="caja__trasera">
        <div class="caja__trasera-login">
          <h3>¿Ya tienes una cuenta?</h3>
          <p>Inicia sesión para entrar en la página</p>
          <button id="btn__iniciar-sesion">Iniciar Sesión</button>
        </div>
        <div class="caja__trasera-register">
          <h3>¿Aún no tienes una cuenta?</h3>
          <p>Regístrate para que puedas iniciar sesión</p>
          <button id="btn__registrarse">Regístrate</button>
        </div>
      </div>

      <div class="contenedor__login-register">
        <form id="form-login" class="formulario__login" novalidate>
          <h2>Iniciar Sesión</h2>
          <input type="email" placeholder="Ingrese su correo electrónico" name="correo" autocomplete="username" required>
          <input type="password" placeholder="Ingrese su contraseña" name="password" autocomplete="current-password" required>
          <button>Entrar</button>
        </form>

        <form id="form-register" class="formulario__register" novalidate>
          <h2>Regístrate</h2>
          <input type="text" placeholder="Ingrese su nombre" name="nombre" required>
          <input type="email" placeholder="Ingrese su correo electrónico" name="correo" autocomplete="email" required>
          <input type="text" placeholder="Ingrese su apodo (usuario)" name="usuario" required>
          <input type="password" placeholder="Contraseña (mínimo 6 caracteres)" name="password" autocomplete="new-password" required>
          <button>Regístrate</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../assets/js/script.js"></script>
  <script type="module">
    import { boot, toast } from "./js/ui.js";
    import { auth, DEMO_ACCOUNTS, DEMO_PASSWORD } from "./js/db.js";

    const user = await boot();
    const next = new URLSearchParams(location.search).get("next");
    // Solo se admiten destinos internos simples (evita redirecciones abiertas).
    const safeNext = next && /^[\w-]+\.html(\?[\w=&%-]*)?$/.test(next) ? next : "index.html";
    if (user) location.replace(safeNext);

    document.getElementById("demo-creds").textContent =
      `${DEMO_ACCOUNTS.empleado} · ${DEMO_ACCOUNTS.cliente} — clave: ${DEMO_PASSWORD}`;

    const enter = async (correo, password) => {
      try {
        await auth.login(correo, password);
        location.href = safeNext;
      } catch (e) {
        toast(e.message, "error");
      }
    };
    document.getElementById("quick-empleado").onclick = () => enter(DEMO_ACCOUNTS.empleado, DEMO_PASSWORD);
    document.getElementById("quick-cliente").onclick = () => enter(DEMO_ACCOUNTS.cliente, DEMO_PASSWORD);

    document.getElementById("form-login").addEventListener("submit", (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      enter(f.get("correo"), f.get("password"));
    });

    document.getElementById("form-register").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try {
        await auth.register(f);
        toast("Usuario registrado. Ya puedes iniciar sesión.");
        e.target.reset();
        document.getElementById("btn__iniciar-sesion").click();
      } catch (err) {
        toast(err.message, "error");
      }
    });
  </script>
</body>
</html>
