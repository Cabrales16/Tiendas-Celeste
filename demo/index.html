<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiendas Celeste</title>
  <link rel="icon" href="../assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/index.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>
  <div id="nav"></div>

  <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active"><img src="../assets/images/accesorios.jpg" class="d-block w-100" alt="Accesorios"></div>
      <div class="carousel-item"><img src="../assets/images/dulces.jpg" class="d-block w-100" alt="Dulces"></div>
      <div class="carousel-item"><img src="../assets/images/maquillaje.jpeg" class="d-block w-100" alt="Maquillaje"></div>
      <div class="carousel-item"><img src="../assets/images/peluches.jpeg" class="d-block w-100" alt="Peluches"></div>
      <div class="carousel-item"><img src="../assets/images/regalos.jpeg" class="d-block w-100" alt="Regalos"></div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Siguiente</span>
    </button>
  </div>

  <div id="ofertastodo">
    <div id="ofertas"><h1>Ofertas</h1></div>
    <div class="card-group" id="prodofertas"></div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module">
    import { boot, toast } from "./js/ui.js";
    import { productos } from "./js/db.js";
    import { productCard, bindCards } from "./js/shop.js";
    await boot();
    const box = document.getElementById("prodofertas");
    box.innerHTML = productos.ofertas().map(productCard).join("");
    bindCards(box);
    if (new URLSearchParams(location.search).has("denegado")) toast("Esa sección es solo para empleados.", "error");
  </script>
</body>
</html>
