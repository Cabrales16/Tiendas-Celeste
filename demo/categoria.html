<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda – Tiendas Celeste</title>
  <link rel="icon" href="../assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>
  <div id="nav"></div>

  <div id="titulo" style="height:100px;background:#fff">
    <h1><p id="titulodesayuno" style="padding-top:1.5%;text-align:center;font-family:'Courier New',Courier,monospace"></p></h1>
  </div>
  <div class="card-group" id="productos" style="margin:3%"></div>
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module">
    import { boot } from "./js/ui.js";
    import { productos } from "./js/db.js";
    import { CATEGORIAS } from "./js/catalogo.js";
    import { productCard, bindCards } from "./js/shop.js";
    await boot();
    const c = new URLSearchParams(location.search).get("c");
    const box = document.getElementById("productos");
    if (!CATEGORIAS[c]) {
      location.replace("index.html");
    } else {
      // Cada categoría conserva su CSS (fondo) original.
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = `../assets/css/${c}.css`;
      document.head.appendChild(link);
      document.title = CATEGORIAS[c].replace(/[^\p{L}\p{N} ]/gu, "").trim() + " – Tiendas Celeste";
      document.getElementById("titulodesayuno").textContent = CATEGORIAS[c];
      box.innerHTML = productos.byCategoria(c).map(productCard).join("");
      bindCards(box);
    }
  </script>
</body>
</html>
